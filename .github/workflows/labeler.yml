name: Label pull requests

# Adds labels from the files a pull request changes (.github/labeler.yml).
# A protected-pricing label means the owner's written approval is required
# (CLAUDE.md).
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/labeler@v7
        with:
          sync-labels: false
