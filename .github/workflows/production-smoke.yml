name: Production smoke check

# Every hour, and a few minutes after each household deploy: are the three
# live sites up, and did the last deploy leave their key pieces working
# (pages, routing, the WhatsApp and batch-lookup functions, Supabase Auth)?
# A failed check is retried once; if it still fails, one issue is opened
# (and closed again when all checks pass). Expectations: engineering/automation/production-smoke-config.json
#
# This is not uptime monitoring: Better Stack checks every 3 minutes and pages
# the on-call person (setup step 07). This catches a deploy that is up but
# broken, and covers the gap until step 07 is done.
#
# Check S01 uses SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY: repository
# variables if set, else engineering/automation/supabase-public.json.
on:
  schedule:
    - cron: '23 * * * *' # hourly, at :23
  workflow_run:
    workflows: [ "TrashDrop CI/CD" ]
    types: [ completed ]
    branches: [ main ]
  workflow_dispatch:
  pull_request:
    paths:
      - 'engineering/automation/production-smoke*'
      - '.github/workflows/production-smoke.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: production-smoke
  cancel-in-progress: false

jobs:
  smoke:
    # After CI, only for pushes to main that passed (that is when Netlify deploys)
    # After every push to main, whatever CI concluded: Netlify deploys it either way
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion != 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Self-test
        run: node engineering/automation/production-smoke.mjs --self-test

      # Netlify builds the household app on its own after the push; give it
      # time to publish before checking.
      - name: Wait for the Netlify deploy
        if: github.event_name == 'workflow_run'
        run: sleep 420

      # On pull requests the live result is shown but doesn't fail the PR:
      # production runs the code on main, not the code in the PR.
      - name: Check production
        id: smoke
        continue-on-error: true
        env:
          SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
        run: node engineering/automation/production-smoke.mjs

      - name: Open or close the tracking issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
          TRIGGER: ${{ github.event_name == 'workflow_run' && format('after deploy of {0}', github.event.workflow_run.head_sha) || github.event_name }}
        with:
          script: |
            const fs = require('fs');
            const title = '[Smoke] Production check failing';
            const { owner, repo } = context.repo;
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'production-smoke', per_page: 100 }))
              .find((i) => i.title === title);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let failures = [];
            try { failures = JSON.parse(fs.readFileSync('production-smoke-result.json', 'utf8')).failures; } catch {}
            if (process.env.OUTCOME === 'success') {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `All checks pass again: ${runUrl}` });
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }
            try { await github.rest.issues.createLabel({ owner, repo, name: 'production-smoke', color: 'd93f0b', description: 'Hourly production smoke check' }); } catch {}
            const body = [
              `The production smoke check failed (${process.env.TRIGGER}): ${runUrl}`,
              '',
              failures.length ? failures.map((f) => `- ${f}`).join('\n') : '- The check could not run (see the run log).',
              '',
              'A site that is down or a payment or pickup path that is broken is a **P1 incident**; anything else is P2 (engineering/policies/incident-management.md).',
              'If it started right after a deploy, roll back first (Rollback in engineering/policies/change-and-release.md: Netlify → previous deploy), then investigate.',
            ].join('\n');
            if (open) await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body });
            else await github.rest.issues.create({ owner, repo, title, body, labels: ['production-smoke', 'type:incident'] });

      - name: Fail the run when a check failed
        if: steps.smoke.outcome != 'success' && github.event_name != 'pull_request'
        run: exit 1
