name: Error watch

# Every day: database errors in production over the last 24 hours, grouped by
# type, read from the Supabase logs through the Management API. A new or
# growing error type opens one issue (P2); it closes when a run finds none.
# Limits and accepted errors: engineering/automation/error-watch-config.json
#
# Setup (setup step 07b, shared with the security watch):
#   secret:   SUPABASE_ACCESS_TOKEN
#   variable: SUPABASE_PROJECT_REF (optional; default in supabase-public.json)
on:
  schedule:
    - cron: '53 5 * * *' # 05:53 UTC (Africa/Accra) daily, after the security watch
  workflow_dispatch:
  pull_request:
    paths:
      - 'engineering/automation/error-watch*'
      - 'engineering/automation/supabase-logs.mjs'
      - '.github/workflows/error-watch.yml'

permissions:
  contents: read
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Self-test
        run: node engineering/automation/error-watch.mjs --self-test

      - name: Check production
        id: watch
        continue-on-error: true
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node engineering/automation/error-watch.mjs

      # Pull requests only check that the script runs; issues come from the
      # scheduled and manual runs.
      - name: Open or close the tracking issue
        if: github.event_name != 'pull_request'
        uses: actions/github-script@v9
        env:
          OUTCOME: ${{ steps.watch.outcome }}
        with:
          script: |
            const fs = require('fs');
            const title = '[Error watch] Production database errors';
            const { owner, repo } = context.repo;
            const open = (await github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'open', labels: 'error-watch', per_page: 100 }))
              .find((i) => i.title === title);
            const runUrl = `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`;
            let failures = [];
            try { failures = JSON.parse(fs.readFileSync('error-watch-result.json', 'utf8')).failures; } catch {}
            if (process.env.OUTCOME === 'success') {
              if (open) {
                await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: `No new or growing error types: ${runUrl}` });
                await github.rest.issues.update({ owner, repo, issue_number: open.number, state: 'closed', state_reason: 'completed' });
              }
              return;
            }
            try { await github.rest.issues.createLabel({ owner, repo, name: 'error-watch', color: 'd93f0b', description: 'Daily production database error check' }); } catch {}
            const body = [
              `The daily error watch found something: ${runUrl}`,
              '',
              failures.length ? failures.map((f) => `- ${f}`).join('\n') : '- The check could not run (see the run log).',
              '',
              'Follow engineering/runbooks/production-errors.md. An error in a payment, pickup or sign-in path is P1 (engineering/policies/incident-management.md).',
            ].join('\n');
            // Not configured yet is a setup task, not an incident
            const notConfigured = failures.length > 0 && failures.every((f) => f.startsWith('Error watch not configured'));
            const text = notConfigured ? [`The daily error watch can't run yet: ${runUrl}`, '', ...failures.map((f) => `- ${f}`), '', 'Setup step 07b in engineering/setup-tracker.md. This issue closes on the first run that passes.'].join('\n') : body;
            if (open) {
              await github.rest.issues.createComment({ owner, repo, issue_number: open.number, body: text });
              if (!notConfigured) await github.rest.issues.addLabels({ owner, repo, issue_number: open.number, labels: ['type:incident', 'P2'] });
            } else {
              await github.rest.issues.create({ owner, repo, title, body: text, labels: notConfigured ? ['error-watch', 'setup'] : ['error-watch', 'type:incident', 'P2'] });
            }

      - name: Fail the run when the check found something
        if: steps.watch.outcome != 'success'
        run: exit 1
