name: TrashDrop CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# A newer push to the same branch or pull request cancels the older run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: write # deploy-preview comments the preview link

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trashdrop
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Node.js
      uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: 'npm'
        cache-dependency-path: trashdrop/package-lock.json
    
    - name: Install dependencies
      env:
        CYPRESS_INSTALL_BINARY: 0 # end-to-end tests don't run here
      run: npm ci

    # Errors fail the build. Test files are not linted yet (see
    # engineering/registers/tech-debt.md).
    - name: Lint
      run: npm run lint

    # Every package the app and its Netlify Functions import is a runtime
    # dependency, so the dependency audit (npm audit --omit=dev) covers it and
    # no update can remove it from under the build.
    - name: Runtime dependency check
      run: |
        node scripts/ci/check-runtime-deps.cjs --self-test
        node scripts/ci/check-runtime-deps.cjs src netlify/functions

    # Every source file is reachable from the app (index.html, the Vite
    # config or a test), and every export is used somewhere: no new copies,
    # debug panels or helpers nothing uses.
    # Files and exports it can't see being used are listed, with a reason,
    # in scripts/ci/unused-files-allowlist.txt.
    - name: Unused files check
      run: |
        node scripts/ci/check-unused-files.cjs --self-test
        node scripts/ci/check-unused-files.cjs

    # No personal data (email, phone, name, address) in console or logger
    # calls: a shared phone's console or a support screenshot can read it
    # (data protection controls). Exceptions with a reason in
    # scripts/ci/log-privacy-allowlist.txt.
    - name: Log privacy check
      run: |
        node scripts/ci/check-log-privacy.cjs --self-test
        node scripts/ci/check-log-privacy.cjs

    # Only TrashDrop domains we own (trashdrops.com) in shipped code and new
    # migrations: trashdrop.app is someone else's (TD58)
    - name: Owned domains check
      run: |
        node scripts/ci/check-domains.cjs --self-test
        node scripts/ci/check-domains.cjs --migrations supabase/migrations --since 20261112231231 src netlify/functions index.html

    # Accepted TrashDrop Digital Bin Pricing (docs/DIGITAL_BIN_PRICING.md).
    # These must pass; don't weaken or skip them to make a change pass.
    - name: Digital bin pricing guard tests
      env:
        CI: true
      run: |
        npx jest --ci src/services/__tests__/digitalBinService.promotion.test.js
        node netlify/functions/__checks__/pricing-promo.js

    # SECURITY DEFINER functions in new migrations: fixed search_path, and a
    # caller check or no anon access (secure development policy, principle 8)
    - name: Database migration checks
      run: |
        node scripts/ci/check-migrations.js --self-test
        node scripts/ci/check-migrations.js

    # Every supabase.rpc() call must name a database function that exists,
    # with parameter names it takes (production snapshot plus this
    # repository's migrations). Unit tests mock the database, so they can't.
    - name: Database call check
      run: |
        node scripts/ci/check-rpc-calls.mjs --self-test
        node scripts/ci/check-rpc-calls.mjs

    # Netlify function checks against stubbed clients (no network)
    - name: Netlify function checks
      run: |
        node netlify/functions/__checks__/check-batch.js
        node netlify/functions/__checks__/csp-report.js
        node netlify/functions/__checks__/whatsapp-smoke.js
    
    # Every unit test suite except the ones listed in
    # scripts/ci/known-failing-tests.txt (a list that may only shrink).
    # Uses placeholder Supabase settings: tests never reach a real project.
    - name: Unit tests
      run: npm run test:ci

    # The whole app and each file in scripts/ci/critical-files.txt, against the
    # floors in scripts/ci/coverage-floors.json (a floor may only go up)
    - name: Test coverage (floors)
      if: always()
      run: node scripts/ci/coverage-summary.mjs
    
    - name: Build
      env:
        REACT_APP_SUPABASE_URL: ${{ secrets.REACT_APP_SUPABASE_URL }}
        REACT_APP_SUPABASE_ANON_KEY: ${{ secrets.REACT_APP_SUPABASE_ANON_KEY }}
        CI: false # Prevent warnings from being treated as errors
        ESLINT_NO_DEV_ERRORS: true # Ignore ESLint warnings
      run: npm run build
    

  # No deploy jobs here: Netlify builds and publishes the site itself from
  # every push to main (production) and every pull request (preview), within
  # about a minute and without waiting for this workflow. CI is a gate only
  # before merge (change-and-release policy, rule 4; branch protection, setup
  # step 08). The old deploy jobs had no Netlify credentials and published
  # nothing while reporting success.
