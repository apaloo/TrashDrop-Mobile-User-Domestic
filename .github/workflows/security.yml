name: Security checks

# Secret scanning and dependency audit.
# Policy: engineering/policies/secure-development.md
on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]
  schedule:
    - cron: '23 4 * * 1' # Mondays 04:23 UTC: full scan of the current files
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar xzf "$file" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks
          gitleaks version

      # Pull requests: only the commits in the pull request.
      - name: Scan pull request commits
        if: github.event_name == 'pull_request'
        run: |
          gitleaks git --no-banner --redact --verbose \
            --config .gitleaks.toml \
            --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"

      # Pushes to main: only the pushed commits.
      - name: Scan pushed commits
        if: github.event_name == 'push'
        run: |
          before="${{ github.event.before }}"
          if [ "$before" = "0000000000000000000000000000000000000000" ]; then range="-1"; else range="$before..${{ github.sha }}"; fi
          gitleaks git --no-banner --redact --verbose --config .gitleaks.toml --log-opts="$range"

      # Weekly and manual: every file as it is now. History is not scanned
      # here: old, already-rotated keys stay in history until it is rewritten
      # (engineering/runbooks/setup/09-supabase-legacy-keys.md).
      - name: Scan current files
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: gitleaks dir . --no-banner --redact --verbose --config .gitleaks.toml

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: trashdrop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      # Fails on a critical finding in a runtime dependency (TD11). High and
      # lower are reported in the summary; most sit in the Create React App
      # build toolchain (TD32). When a new critical advisory turns this red,
      # fix it in its own PR first: engineering/policies/vulnerability-management.md.
      - name: npm audit
        run: |
          npm audit --omit=dev --audit-level=critical > audit.txt 2>&1; status=$?
          {
            echo '### npm audit (runtime dependencies)'
            echo '```'
            tail -n 25 audit.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status
