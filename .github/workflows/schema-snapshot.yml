name: Schema snapshot

# Weekly and on demand: writes the live production schema into
# trashdrop/supabase/schema/ (one file per table, function and view) and opens
# a pull request when production changed (TD18, ADR-001). Pull requests that
# touch the script only run its self-test.
#
# Setup (Settings → Secrets and variables → Actions): the same as the
# security watch: secret SUPABASE_ACCESS_TOKEN (SUPABASE_PROJECT_REF is
# optional; default in engineering/automation/supabase-public.json).
# Opening the pull request needs Settings → Actions → General → "Allow GitHub
# Actions to create and approve pull requests"; without it the snapshot is
# kept as the run's artifact.
on:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC (Africa/Accra)
  workflow_dispatch:
  pull_request:
    paths:
      - 'engineering/automation/schema-snapshot.mjs'
      - '.github/workflows/schema-snapshot.yml'

permissions:
  contents: write
  pull-requests: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Self-test
        run: node engineering/automation/schema-snapshot.mjs --self-test

      - name: Read production schema
        if: github.event_name != 'pull_request'
        env:
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node engineering/automation/schema-snapshot.mjs

      - name: Keep the snapshot
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: schema-snapshot
          path: trashdrop/supabase/schema

      - name: Open a pull request when production changed
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$(git status --porcelain trashdrop/supabase/schema)" ]; then
            echo "Production schema unchanged since the last snapshot." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="schema-snapshot/$(date -u +%Y-%m-%d)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B "$branch"
          git add trashdrop/supabase/schema
          git commit -m "Schema snapshot $(date -u +%Y-%m-%d)" -m "Generated from production by engineering/automation/schema-snapshot.mjs."
          git push -f origin "$branch"
          changed=$(git diff --stat HEAD~1 -- trashdrop/supabase/schema | tail -1)
          body="Production schema changed since the last snapshot ($changed).

          Each file is one table, function or view as it is in production now. Every change here should match a merged migration in \`trashdrop/supabase/migrations/\` (ADR-001); a change with no migration was made by hand and needs one.

          Generated by the *Schema snapshot* workflow."
          if gh pr view "$branch" >/dev/null 2>&1; then
            echo "Pull request for $branch already open; updated it." >> "$GITHUB_STEP_SUMMARY"
          elif ! gh pr create --base main --head "$branch" --title "Schema snapshot $(date -u +%Y-%m-%d)" --body "$body"; then
            echo "Could not open the pull request: allow GitHub Actions to create pull requests (Settings → Actions → General), or download the *schema-snapshot* artifact." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
