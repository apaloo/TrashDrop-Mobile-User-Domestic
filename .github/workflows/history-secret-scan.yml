name: History secret scan

# Weekly: every commit in the household, carter and admin repositories,
# scanned for secrets (engineering/automation/history-secret-scan.mjs). The
# pull-request scan in security.yml only sees new commits. Fails on a finding
# nobody has reviewed: engineering/runbooks/secret-in-git-history.md.
on:
  schedule:
    - cron: '17 5 * * 2' # Tuesdays 05:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - 'engineering/automation/history-secret-scan*'
      - '.github/workflows/history-secret-scan.yml'
      - '.gitleaks.toml'

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.21.2

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          path: household
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Self-test
        run: node household/engineering/automation/history-secret-scan.mjs --self-test

      - name: Check out the carter and admin repositories (full history)
        if: github.event_name != 'pull_request'
        run: |
          git clone --quiet https://github.com/apaloo/TrashDrop-Mobile-Collector-Driver.git collector
          git clone --quiet https://github.com/apaloo/TrashDrop_Management_webApp_admins.git admin

      - name: Install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$file" "$base/$file"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" checksums.txt | sha256sum -c -
          tar xzf "$file" gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      # Pull requests changing the scan: the household history only, so a
      # rule change that would flag old findings shows up before merging.
      - name: Scan
        run: |
          repos="household=household"
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            repos="$repos collector=collector admin=admin"
          fi
          node household/engineering/automation/history-secret-scan.mjs $repos > summary.md; status=$?
          cat summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"
          exit $status
