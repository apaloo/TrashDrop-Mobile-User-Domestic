# Weekly dependency update pull requests. Each one runs the full CI.
# Owner: Technical Lead. Policy: engineering/policies/secure-development.md
version: 2
updates:
  - package-ecosystem: npm
    directory: /trashdrop
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels: [dependencies]
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Major upgrades change APIs and need planned work (a tech-debt item and
      # its own PR), so Dependabot proposes only minor and patch updates.
      - dependency-name: "*"
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels: [dependencies, ci]
    groups:
      actions:
        patterns: ["*"]
