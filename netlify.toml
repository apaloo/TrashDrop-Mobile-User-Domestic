[build]
  base = "trashdrop"
  publish = "build"
  command = "CI=false npm run build"

[build.environment]
  # Node 22 LTS (supported to April 2027); Node 20 reached end of life in April 2026
  NODE_VERSION = "22"

# The app moved to app.trashdrops.com: send the old Netlify address there.
# Only the old host matches, so app.trashdrops.com and deploy previews are untouched.
[[redirects]]
  from = "https://trashdrop-mobile-przsu.netlify.app/*"
  to = "https://app.trashdrops.com/:splat"
  status = 301
  force = true

# Redirect rule to support client-side routing for the SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every response (2026-11-12; the site had none).
# HTTPS only; never inside another site's frame (clickjacking); no MIME
# sniffing; no full URLs leaked to other sites; only the browser features the
# app uses (camera for QR codes, location, share sheet). A full Content
# Security Policy is TD57: sent report-only below until the reports are clean.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "upgrade-insecure-requests; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), web-share=(self), microphone=(), payment=(), usb=()"
    # TD57: the full policy, reported but not enforced yet. Violations go to
    # netlify/functions/csp-report.js (Netlify: Logs > Functions > csp-report).
    Content-Security-Policy-Report-Only = "default-src 'self'; script-src 'self' 'unsafe-inline' https://accounts.google.com https://unpkg.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://unpkg.com https://accounts.google.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.supabase.co wss://*.supabase.co https://nominatim.openstreetmap.org https://api.bigdatacloud.net https://ipapi.co https://accounts.google.com https://*.ingest.sentry.io https://*.ingest.us.sentry.io https://*.ingest.de.sentry.io; frame-src https://accounts.google.com; worker-src 'self' blob:; manifest-src 'self'; media-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; report-uri /.netlify/functions/csp-report"

# Cache control for static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment settings for production
[context.production.environment]
  REACT_APP_API_URL = "https://api.trashdrops.com"
  # Note: Sensitive environment variables should be set in the Netlify dashboard

# Enable PWA features and offline capabilities
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "max-age=0, no-cache, no-store, must-revalidate"

# Local development configuration
[dev]
  # Netlify Dev UI port
  port = 8889
  # Proxy to an already running Vite dev server (PORT=3010 npm start)
  targetPort = 3010
  # Directory for Netlify Functions
  functions = "netlify/functions"
  # Disable framework auto-detection to avoid auto-starting the dev server
  framework = "#custom"
  # Do not auto open browser
  autoLaunch = false
  # No-op command; the Vite dev server (npm start) is already running on targetPort
  command = "npm run dev:noop"
