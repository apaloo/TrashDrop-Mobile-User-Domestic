# gitleaks configuration: the default rules, plus a few known-safe paths.
# Adding an allowlist entry needs the Technical Lead's review (CODEOWNERS).
title = "TrashDrop secret scanning"

[extend]
useDefault = true

[allowlist]
description = "Known-safe files"
paths = [
  # Lockfiles contain integrity hashes, not secrets.
  '''(^|/)package-lock\.json$''',
  # Example env files contain placeholders only.
  '''(^|/)\.env[^/]*\.example$''',
  '''(^|/)node_modules/''',
]
