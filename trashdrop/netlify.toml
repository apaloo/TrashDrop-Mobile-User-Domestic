[build]
  publish = "build"
  command = "CI=false npm run build"

# Redirect rule to support client-side routing for the SPA
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers on every response (2026-11-12; the site had none).
# HTTPS only; never inside another site's frame (clickjacking); no MIME
# sniffing; no full URLs leaked to other sites; only the browser features the
# app uses (camera for QR codes, location, share sheet). A full Content
# Security Policy is TD57: report-only first, the app loads maps and tiles
# from several hosts.
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "upgrade-insecure-requests; frame-ancestors 'none'"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(self), geolocation=(self), web-share=(self), microphone=(), payment=(), usb=()"

# Cache control for static assets
[[headers]]
  for = "/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Environment settings for production
[context.production.environment]
  REACT_APP_API_URL = "https://api.trashdrops.com"
  # Note: Sensitive environment variables should be set in the Netlify dashboard

# Enable PWA features and offline capabilities
[[headers]]
  for = "/service-worker.js"
  [headers.values]
    Cache-Control = "max-age=0, no-cache, no-store, must-revalidate"

# Netlify Functions configuration
[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[functions."whatsapp-webhook"]
  # qrcode is shipped rather than bundled — the booking confirmation renders the
  # digital bin QR server-side, the way the app renders it client-side
  external_node_modules = ["@supabase/supabase-js", "qrcode"]

[functions."whatsapp-notify"]
  external_node_modules = ["@supabase/supabase-js"]

# Local development configuration
[dev]
  # Netlify Dev UI port
  port = 8889
  # Proxy to an already running Vite dev server (PORT=3010 npm start)
  targetPort = 3010
  # Directory for Netlify Functions
  functions = "netlify/functions"
  # Disable framework auto-detection to avoid auto-starting the dev server
  framework = "#custom"
  # Do not auto open browser
  autoLaunch = false
  # No-op command; the Vite dev server (npm start) is already running on targetPort
  command = "npm run dev:noop"
